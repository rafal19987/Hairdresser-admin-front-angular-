<h2 mat-dialog-title>Szczegóły użytkownika</h2>
<mat-dialog-content>
  <p><strong>ID:</strong> {{ data.uuid }}</p>
  <p><strong>Imię:</strong> {{ data.firstName }}</p>
  <p><strong>Email:</strong> {{ data.email }}</p>
  <p><strong>Rola:</strong> {{ data.role }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Zamknij</button>
</mat-dialog-actions>
