<div class="p-4">
  <div class="w-full flex items-center justify-between">
    <h2 class="text-xl font-semibold mb-4">Lista ról</h2>

    <a
      *hasPermission="{resource: 'roles', action: 'create'}"
      mat-flat-button
      [routerLink]="'./add'"
    >Dodaj rolę</a>
  </div>

  <table
    class="table-auto w-full border-collapse border border-gray-200"
  >
    <thead>
    <tr class="bg-gray-100">
      <th class="border border-gray-200 px-4 py-2 text-left">Nazwa</th>
      <th class="border border-gray-200 px-4 py-2 text-left">Akcje</th>
    </tr>
    </thead>
    <tbody>
      @if (roles?.length) {
        @for (role of roles; track role.uuid)
        {
          <tr class="even:bg-slate-100">
            <td class="border border-gray-200 px-4 py-2">{{ role.displayName }}</td>
            <td class="border border-gray-200 px-4 py-2 text-center">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <a [routerLink]="['./', role.uuid]" mat-menu-item>
                  <mat-icon>info</mat-icon>
                  <span>Zobacz szczegóły</span>
                </a>
<!--                <button mat-menu-item (click)="confirmDelete(user)">-->
<!--                  <mat-icon>delete</mat-icon>-->
<!--                  <span>Usuń rolę</span>-->
<!--                </button>-->
              </mat-menu>
            </td>
          </tr>
        }
      } @else {
        <td class="border border-gray-200 px-4 py-2">Brak ról do wyświetlenia</td>
      }
    </tbody>
  </table>
</div>
