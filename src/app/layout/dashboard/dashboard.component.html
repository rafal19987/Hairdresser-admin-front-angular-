<div class="flex min-h-dvh bg-gray-100 h-full">
  <!-- Sidebar -->
  <aside
    class="w-64 bg-white shadow-md h-full flex flex-col transition-all"
    [class.hidden]="!isSidebarOpen"
    >
    <div class="p-4 border-b">
      <h2 class="text-lg font-bold text-gray-800">Menu</h2>
    </div>
    <nav class="flex-1 p-4 space-y-4">
      <!-- Użytkownicy z podmenu -->
      <div>
        <button
          class="flex items-center justify-between w-full text-left py-2 px-4 rounded hover:bg-gray-200"
          (click)="toggleUsersSubmenu()"
          >
          <span>Użytkownicy</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 transition-transform"
            [class.rotate-180]="isUsersSubmenuOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>
          @if (isUsersSubmenuOpen) {
            <div class="ml-4 mt-2 space-y-2">
              <a
                routerLink="/dashboard/users"
                routerLinkActive="bg-gray-200 text-gray-800"
                class="block py-2 px-4 rounded hover:bg-gray-200"
                >
                Lista użytkowników
              </a>
              <a
                routerLink="/dashboard/users/add"
                routerLinkActive="bg-gray-200 text-gray-800"
                class="block py-2 px-4 rounded hover:bg-gray-200"
                >
                Utwórz użytkownika
              </a>
            </div>
          }
      </div>

      <div>
        <button
          class="flex items-center justify-between w-full text-left py-2 px-4 rounded hover:bg-gray-200"
          (click)="toggleRolesSubmenu()"
        >
          <span>Role</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 transition-transform"
            [class.rotate-180]="isRolesSubmenuOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        @if (isRolesSubmenuOpen) {
          <div class="ml-4 mt-2 space-y-2">
            <a
              routerLink="/dashboard/roles"
              routerLinkActive="bg-gray-200 text-gray-800"
              class="block py-2 px-4 rounded hover:bg-gray-200"
            >
              Lista ról
            </a>
            <a
              routerLink="/dashboard/roles/add"
              routerLinkActive="bg-gray-200 text-gray-800"
              class="block py-2 px-4 rounded hover:bg-gray-200"
            >
              Utwórz rolę
            </a>
          </div>
        }
      </div>

        <!-- Inne elementy menu -->
        <a
          routerLink="/dashboard/settings"
          routerLinkActive="bg-gray-200 text-gray-800"
          class="block py-2 px-4 rounded hover:bg-gray-200"
          >
          Settings
        </a>

        <!-- Logout -->
        <button
          (click)="logout()"
          class="w-full text-left py-2 px-4 rounded hover:bg-gray-200"
          >
          Logout
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
      <header class="bg-white shadow px-4 py-2 flex items-center">
        <button
          class="mr-4 text-gray-800 focus:outline-none hover:bg-slate-200 transition-colors duration-300 rounded-lg p-2"
          (click)="toggleSidebar()"
          >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"
              />
            </svg>
          </button>
          <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>
        </header>

        <div class="p-4 flex-1 bg-gray-50">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
