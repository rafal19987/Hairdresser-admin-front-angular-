<div class="flex h-dvh overflow-hidden bg-surface-sunken">
  <!-- Sidebar -->
  <aside
    class="w-64 shrink-0 overflow-y-auto bg-black border-r border-line h-full flex flex-col transition-all"
    [class.hidden]="!isSidebarOpen"
  >
    <div class="px-6 pt-6 pb-8">
      <a
        routerLink="/dashboard"
        class="font-exo text-3xl font-bold leading-none text-white transition-colors duration-150 hover:text-gold"
      >
        Rêve
      </a>
      <p class="mt-2 text-sm uppercase tracking-widest text-muted">Panel salonu</p>
    </div>
    <nav class="flex flex-1 flex-col gap-1 px-6 pb-6">
      <!-- Użytkownicy z podmenu -->
      <div>
        <button
          type="button"
          class="nav-link flex items-center justify-between w-full text-left"
          [attr.aria-expanded]="isUsersSubmenuOpen"
          (click)="toggleUsersSubmenu()"
        >
          <span>Użytkownicy</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-gold transition-transform"
            [class.rotate-180]="isUsersSubmenuOpen"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        @if (isUsersSubmenuOpen) {
          <div class="ml-4 flex flex-col border-l border-line pl-3">
            <a
              routerLink="/dashboard/users"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link nav-link--sub"
            >
              Lista użytkowników
            </a>
            <a
              routerLink="/dashboard/users/add"
              routerLinkActive="active"
              class="nav-link nav-link--sub"
            >
              Utwórz użytkownika
            </a>
          </div>
        }
      </div>

      <a routerLink="/dashboard/roles" routerLinkActive="active" class="nav-link">Role</a>
      <a routerLink="/dashboard/services" routerLinkActive="active" class="nav-link">Usługi</a>
      <a routerLink="/dashboard/users-services" routerLinkActive="active" class="nav-link">Przypisania usług</a>
      <a routerLink="/dashboard/calendar" routerLinkActive="active" class="nav-link">Kalendarz</a>
      <a
        *hasPermission="{ resource: 'audit-logs', action: 'read' }"
        routerLink="/dashboard/audit-logs"
        routerLinkActive="active"
        class="nav-link"
      >
        Logi zdarzeń
      </a>
      <a routerLink="/dashboard/settings" routerLinkActive="active" class="nav-link">Ustawienia</a>

      <button
        type="button"
        (click)="logout()"
        class="nav-link mt-auto text-left"
      >
        Wyloguj się
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex min-w-0 flex-1 flex-col">
    <header class="bg-black border-b border-line px-4 py-3 flex items-center">
      <button
        type="button"
        aria-label="Pokaż lub ukryj menu"
        class="mr-4 text-gold focus:outline-none hover:text-white transition-colors duration-300 p-2"
        (click)="toggleSidebar()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>
      </button>
      @if (!isSidebarOpen) {
        <span class="font-exo text-2xl font-bold text-white">Rêve</span>
      }
    </header>

    <!-- Details drawer opens over this area only, so the navigation stays usable -->
    <app-drawer-container>
      <router-outlet></router-outlet>
    </app-drawer-container>
  </main>
</div>
